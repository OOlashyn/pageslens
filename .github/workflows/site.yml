name: Docs site

# Builds the documentation site (site/, spec 0012) and deploys it to GitHub Pages at
# pageslens.olashyn.dev. It deploys when a release is published, so the site describes the version
# on npm, and on a manual run for a docs fix between releases. Pull requests that touch the docs
# only build it, so a broken link fails the pull request rather than the release.
# The github-pages environment allows main and v* tags: a release runs on its tag.

on:
  release:
    types: [published]
  workflow_dispatch:
  pull_request:
    paths:
      - 'site/**'
      - 'docs/**'
      - 'rules/**'
      - 'scripts/sync-docs.ts'
      - '.github/workflows/site.yml'

permissions:
  contents: read

concurrency:
  group: site-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: withastro/action@a8b97df764791eb61fbf3338ef713b0e61ae05c5 # v6.1.4
        with:
          path: ./site
          node-version: '24'

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
