name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Latest release of each supported line; minimums are the October 2026 security releases
        include:
          - node: '22'
            min: '22.23.4'
          - node: '24'
            min: '24.22.1'
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: ${{ matrix.node }}
          cache: true
      - name: Require a patched Node.js
        run: |
          node -e '
            const [a, b] = [process.versions.node, process.argv[1]].map((v) => v.split(".").map(Number));
            const ok = a[0] === b[0] && (a[1] > b[1] || (a[1] === b[1] && a[2] >= b[2]));
            console.log(`node ${process.versions.node}, minimum ${process.argv[1]}`);
            process.exit(ok ? 0 : 1);
          ' '${{ matrix.min }}'
      - run: vp check
      - run: vp test
      - run: vp pack
      - run: node dist/bin.mjs --version

  # The action (action.yml) on EcoFlux, with this commit's build instead of the release on npm
  action:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # the access-changes comment; EcoFlux rarely changes, so it's rarely posted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: '24'
          cache: true
      - run: vp pack
      - id: pageslens
        uses: ./
        continue-on-error: true # EcoFlux has lint errors, so the action fails the step
        env:
          PAGESLENS_ACTION_CLI: dist/bin.mjs
        with:
          path: test/fixtures/ecoflux
          policy: test/fixtures/policies/ecoflux.policy.yaml
          solution: test/fixtures/solution-ecoflux
          sarif: false # fixture findings don't belong in this repository's code scanning
      - name: Check the outputs
        env:
          OUTCOME: ${{ steps.pageslens.outcome }}
          LINT_ERRORS: ${{ steps.pageslens.outputs.lint-errors }}
          POLICY_FAILURES: ${{ steps.pageslens.outputs.policy-failures }}
          ALIGN_ERRORS: ${{ steps.pageslens.outputs.align-errors }}
          WIDER: ${{ steps.pageslens.outputs.wider }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "outcome=$OUTCOME lint-errors=$LINT_ERRORS policy-failures=$POLICY_FAILURES align-errors=$ALIGN_ERRORS wider=$WIDER"
          test "$OUTCOME" = failure
          test "$LINT_ERRORS" = 4
          test "$POLICY_FAILURES" = 0
          test "$ALIGN_ERRORS" = 0
          if [ "$EVENT" = pull_request ]; then test -n "$WIDER"; fi
