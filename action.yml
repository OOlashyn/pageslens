name: pageslens
description: Lint and policy tests for Power Pages site configuration, with code scanning alerts and an access-changes comment on pull requests
author: Oleksandr Olashyn (dancingwithcrm)
branding:
  icon: shield
  color: purple

inputs:
  path:
    description: The site folder, as for `pageslens lint`. One site per step.
    default: .
  policy:
    description: The policy file. Default is the nearest pageslens.policy.yaml; with none, policy tests are skipped.
    default: ''
  solution:
    description: The unpacked solution to compare `path` with, as for `pageslens align`. Empty (the default) skips align.
    default: ''
  lint:
    description: Run `pageslens lint`.
    default: 'true'
  test:
    description: Run `pageslens test` when a policy file is found.
    default: 'true'
  diff:
    description: Run `pageslens diff` on pull requests.
    default: 'true'
  sarif:
    description: Upload lint, test and align results to code scanning (needs `security-events` write).
    default: 'true'
  comment:
    description: Post the access changes (and the alignment, with `solution`) as one pull request comment, edited on each run (needs `pull-requests` write).
    default: 'true'
  fail-on:
    description: Fail when the diff has `wider` changes, or `any` change. Default is to never fail on the diff.
    default: ''
  base:
    description: The ref to compare with. Default is the pull request's base branch; `origin/` is added to a branch name.
    default: ''
  node-version:
    description: Node.js version for pageslens.
    default: '24'
  token:
    description: Token for the comment.
    default: ${{ github.token }}

outputs:
  wider:
    description: Number of wider access changes.
    value: ${{ steps.run.outputs.wider }}
  narrower:
    description: Number of narrower access changes.
    value: ${{ steps.run.outputs.narrower }}
  neutral:
    description: Number of neutral access changes.
    value: ${{ steps.run.outputs.neutral }}
  lint-errors:
    description: Number of lint findings at error level.
    value: ${{ steps.run.outputs.lint-errors }}
  policy-failures:
    description: Number of failed policy statements.
    value: ${{ steps.run.outputs.policy-failures }}
  align-errors:
    description: Number of align findings at error level, when `solution` is set.
    value: ${{ steps.run.outputs.align-errors }}
  comment-url:
    description: The access-changes comment, when one was posted or updated.
    value: ${{ steps.comment.outputs.comment-url }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        package-manager-cache: false

    - id: run
      shell: bash
      run: node "$GITHUB_ACTION_PATH/action/main.ts" run
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_POLICY: ${{ inputs.policy }}
        INPUT_SOLUTION: ${{ inputs.solution }}
        INPUT_LINT: ${{ inputs.lint }}
        INPUT_TEST: ${{ inputs.test }}
        INPUT_DIFF: ${{ inputs.diff }}
        INPUT_SARIF: ${{ inputs.sarif }}
        INPUT_COMMENT: ${{ inputs.comment }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_BASE: ${{ inputs.base }}

    - id: upload
      if: ${{ !cancelled() && steps.run.outputs.sarif-dir != '' }}
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        sarif_file: ${{ steps.run.outputs.sarif-dir }}

    - if: ${{ !cancelled() && steps.upload.outcome == 'failure' }}
      shell: bash
      run: |
        echo "::notice title=pageslens::SARIF upload failed. Code scanning needs to be available for the repository, and the job needs \`security-events: write\`."

    - id: comment
      if: ${{ !cancelled() && inputs.comment == 'true' && steps.run.outputs.comment-file != '' && steps.run.outputs.fork == 'false' }}
      shell: bash
      run: node "$GITHUB_ACTION_PATH/action/main.ts" comment
      env:
        INPUT_TOKEN: ${{ inputs.token }}
        COMMENT_FILE: ${{ steps.run.outputs.comment-file }}
        HAS_CHANGES: ${{ steps.run.outputs.has-changes }}

    - if: ${{ !cancelled() }}
      shell: bash
      run: node "$GITHUB_ACTION_PATH/action/main.ts" finish
